<section
  class="grid min-h-[65svh] grid-cols-1 items-center gap-12 xl:grid-cols-[1.1fr_0.9fr] xl:gap-24"
  aria-labelledby="home-title"
>
  <div class="max-w-xl">
    <h1
      id="home-title"
      class="mb-5 max-w-[14ch] text-4xl font-semibold leading-[1.12] tracking-[-0.035em] text-foreground sm:text-[2.75rem]"
    >
      Tu próxima celebración empieza aquí.
    </h1>
    <p class="max-w-[42ch] text-base leading-7 text-muted-foreground">
      Este espacio te ayudará a crear una invitación a tu manera y a tener los
      detalles de tu evento en un solo lugar.
    </p>
    <p
      class="mt-7 flex items-center gap-2.5 text-sm font-semibold text-foreground"
    >
      <svg
        lucideCirclePlus
        aria-hidden="true"
        class="size-[18px] text-primary"
      ></svg>
      Aún no tienes eventos
    </p>
  </div>

  <div
    class="relative mx-auto aspect-[0.91] w-[min(100%,25rem)] max-sm:w-[min(78%,19rem)]"
    aria-hidden="true"
  >
    <div
      class="absolute inset-[6%_6%_4%_8%] rotate-[5deg] border border-accent/60 bg-accent/35"
    ></div>
    <div
      class="absolute inset-[7%_10%_3%_6%] rotate-[-7deg] border border-border bg-primary"
    ></div>
    <div
      class="absolute inset-[0_7%_7%_0] flex flex-col items-center justify-center border border-border border-t-4 border-t-primary bg-card px-6 py-8 text-center sm:px-10"
    >
      <p class="mb-2 text-sm font-medium text-foreground/80">Un día especial</p>
      <p
        class="mb-4 max-w-[9ch] text-3xl font-medium leading-tight tracking-[-0.03em] text-foreground sm:text-4xl"
      >
        Una historia por celebrar
      </p>
      <p class="max-w-[20ch] text-xs leading-5 text-muted-foreground">
        Tu invitación tomará forma aquí, cuando estés listo.
      </p>
      <span
        class="mt-8 grid size-12 place-items-center rounded-full border border-accent/60 bg-accent/40 text-sm font-semibold text-foreground"
        >i</span
      >
    </div>
  </div>
</section>
